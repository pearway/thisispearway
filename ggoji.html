<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FlorMonde · 오브제 브랜드 — PEARWAY</title>

<meta name="description" content="독창적인 디자이너 오브제 브랜드 FlorMonde. PEARWAY가 만든 오브제 라인. 우산꽂이 백합, 유리홉스, 홍콩야자로 시작합니다. 준비중.">
<meta name="keywords" content="FlorMonde, 플로르몽드, 오브제 브랜드, 디자이너 오브제, 우산꽂이, 백합, 유리홉스, 홍콩야자, PEARWAY, 페어웨이">
<meta name="author" content="PEARWAY">
<meta property="og:type" content="website">
<meta property="og:url" content="https://www.pearway.kr/ggoji">
<meta property="og:title" content="FlorMonde · 오브제 브랜드 — PEARWAY">
<meta property="og:description" content="독창적인 디자이너 오브제 브랜드 FlorMonde. 우산꽂이 백합, 유리홉스, 홍콩야자로 시작합니다. 준비중.">
<meta property="og:image" content="https://www.pearway.kr/images/og-thumbnail.jpg">
<link rel="canonical" href="https://www.pearway.kr/ggoji">
<link rel="icon" type="image/svg+xml" href="favicon.svg">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" as="style" crossorigin
  href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="site.css">
</head>
<body>

<!-- HEADER (logo only → home) -->
<header class="site">
  <div class="inner">
    <a href="/" class="brand home" aria-label="홈으로"><svg class="home-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V20a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V9.5"/><path d="M9.5 21v-6h5v6"/></svg></a>
  </div>
</header>

<!-- PRODUCTS (제품 바로 노출) -->
<main>
<section class="section ggoji-top" id="products">
  <div class="wrap">
    <div class="objects-grid">

      <a class="object-card" href="#lily" data-product="lily">
        <div class="object-thumb"><img src="images/objects/ggoji-lily.jpg" alt="백합" loading="lazy"></div>
        <div class="object-meta">
          <h3 class="object-name">백합</h3>
        </div>
      </a>

      <a class="object-card" href="#euryops" data-product="euryops">
        <div class="object-thumb"><img src="images/objects/ggoji-euryops.jpg" alt="유리홉스" loading="lazy"></div>
        <div class="object-meta">
          <h3 class="object-name">유리홉스</h3>
        </div>
      </a>

      <a class="object-card" href="#schefflera" data-product="schefflera">
        <div class="object-thumb"><img src="images/objects/ggoji-schefflera.jpg" alt="홍콩야자" loading="lazy"></div>
        <div class="object-meta">
          <h3 class="object-name">홍콩야자</h3>
        </div>
      </a>

    </div>
  </div>
</section>
</main>

<!-- PRODUCT DETAIL -->
<div class="detail-overlay" id="detail-overlay">
  <div class="detail-header">
    <button class="back" id="detail-close" aria-label="닫기">←</button>
    <span class="name" id="detail-name"></span>
  </div>
  <div class="detail-body" id="detail-body"></div>
</div>

<!-- FOOTER -->
<footer class="site">
  <div class="inner">
    <div class="left">
      <div class="meta">
        <span>FlorMonde · Object brand by PEARWAY</span>
        <a href="/brand">THISISPEARWAY ↗</a>
      </div>
    </div>
    <div class="right">
      <div>오브제 · Objects</div>
      <div>Seoul, KR · 2026</div>
    </div>
  </div>
  <div class="wrap copyright">
    <span>© 2026 PEARWAY</span>
    <span>Designer · Lee Heebae</span>
  </div>
</footer>

<script>
  document.body.classList.add('loaded');
  const h = document.querySelector('header.site');
  const s = () => h.classList.toggle('scrolled', window.scrollY > 8);
  window.addEventListener('scroll', s, { passive: true }); s();

  /* ---------- Product detail ---------- */
  const PRODUCTS = {
    lily:       { name: '백합',   imgs: ['ggoji-lily.jpg', 'ggoji-lily-b.jpg', 'ggoji-lily-f.jpg'] },
    euryops:    { name: '유리홉스', imgs: ['ggoji-euryops.jpg', 'ggoji-euryops-b.jpg', 'ggoji-euryops-f.jpg'] },
    schefflera: { name: '홍콩야자', imgs: ['ggoji-schefflera.jpg', 'ggoji-schefflera-b.jpg', 'ggoji-schefflera-f.jpg'] }
  };
  const overlay = document.getElementById('detail-overlay');
  const dName = document.getElementById('detail-name');
  const dBody = document.getElementById('detail-body');

  function openProduct(key) {
    const p = PRODUCTS[key];
    if (!p) return;
    dName.textContent = p.name;
    dBody.innerHTML = `
      <div class="detail-hero"><h1>${p.name}</h1><p class="desc">개업 선물로 잘 어울리는 오브제입니다. 화분 트레이로도, 우산꽂이로도 쓸 수 있어요.</p></div>
      <section class="cs-sec"><div class="cs-gallery">${
        p.imgs.map((src, i) => `<div class="cs-shot${i === 1 ? ' cs-wide' : ''}"><img src="images/objects/${src}" alt="" loading="lazy"></div>`).join('')
      }</div></section>`;
    overlay.classList.add('open');
    document.body.classList.add('modal-open');
    overlay.scrollTop = 0;
    if (location.hash !== '#' + key) history.pushState({ p: key }, '', '#' + key);
  }
  function closeProduct() {
    overlay.classList.remove('open');
    document.body.classList.remove('modal-open');
    if (location.hash) history.pushState({}, '', location.pathname);
  }

  document.querySelectorAll('.object-card[data-product]').forEach(c => {
    c.addEventListener('click', e => { e.preventDefault(); openProduct(c.dataset.product); });
  });
  document.getElementById('detail-close').addEventListener('click', closeProduct);
  window.addEventListener('keydown', e => { if (e.key === 'Escape' && overlay.classList.contains('open')) closeProduct(); });
  window.addEventListener('popstate', () => {
    const key = location.hash.slice(1);
    if (PRODUCTS[key]) openProduct(key);
    else if (overlay.classList.contains('open')) { overlay.classList.remove('open'); document.body.classList.remove('modal-open'); }
  });
  if (PRODUCTS[location.hash.slice(1)]) openProduct(location.hash.slice(1));
</script>
</body>
</html>
