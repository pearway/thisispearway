<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>그래픽 디자인 / PEARWAY</title>
<meta name="description" content="페어웨이 그래픽 디자인. 로고와 브랜드 아이덴티티, 명함, 인쇄물. 서울의 디자인 스튜디오.">
<meta property="og:title" content="그래픽 디자인 / PEARWAY">
<meta property="og:description" content="로고와 브랜드 아이덴티티, 명함, 인쇄물. 서울의 디자인 스튜디오.">
<meta property="og:type" content="website">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" as="style" crossorigin
  href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="pearway.css?v=2">
<link rel="icon" type="image/svg+xml" href="favicon.svg">

<style>
  .wrap{max-width:1320px;margin:0 auto;padding:0 var(--pad)}
  .hero{padding:calc(clamp(16px,2.2vw,24px) + clamp(44px,6vw,70px)) var(--pad) 0}
  .hero-ph{width:100%;height:78svh;min-height:440px;border-radius:14px;overflow:hidden;background:var(--ph)}
  .hero-img{width:100%;height:100%;object-fit:cover;display:block}
  .phead{padding:calc(clamp(44px,6vw,70px) + clamp(40px,5vw,72px)) var(--pad) clamp(44px,6vw,90px)}
  .phead h1{margin:0;font-weight:600;letter-spacing:-.04em;line-height:1.02;font-size:clamp(1.9rem,4vw,2.5rem)}
  .phead .sub{margin:clamp(16px,2vw,24px) 0 0;max-width:52ch;color:var(--dim);font-size:clamp(.95rem,1.1vw,1.06rem);line-height:1.6}
  .shead{display:flex;align-items:baseline;justify-content:space-between;gap:20px;padding:0 var(--pad) clamp(20px,2.4vw,30px);border-bottom:1px solid var(--line)}
  .shead h2{margin:0;font-weight:600;letter-spacing:-.02em;font-size:clamp(1rem,1.4vw,1.15rem)}
  /* 개별 작업물 피드 (프로젝트로 묶지 않고 낱장으로) */
  .g-feed{padding:clamp(24px,3vw,40px) var(--pad) clamp(40px,6vw,90px);columns:2;column-gap:clamp(22px,3.4vw,56px)}
  @media(max-width:720px){.g-feed{columns:1}}
  .g-item{break-inside:avoid;margin:0 0 clamp(40px,5vw,70px)}
  .g-ph{width:100%;border-radius:12px;overflow:hidden;background:var(--ph)}
  .g-ph img{width:100%;height:auto;display:block}
  .g-cap{margin-top:14px}
  .g-nm{display:block;font-weight:600;letter-spacing:-.02em;font-size:clamp(1.02rem,1.5vw,1.2rem);line-height:1.2}
  .g-spec{display:block;margin-top:6px;font-family:var(--mono);font-size:11.5px;letter-spacing:.02em;color:var(--dim);line-height:1.5}
  @media(hover:hover){.g-item:hover .g-ph{opacity:.95}}
  .contact{padding:clamp(80px,12vw,160px) 0}
  .contact h2{margin:0;font-weight:600;letter-spacing:-.04em;line-height:1.05;font-size:clamp(1.9rem,4vw,2.5rem)}
  .inq{max-width:620px;margin:clamp(34px,4.5vw,56px) 0 0;display:flex;flex-direction:column;gap:12px}
  .inq-row{display:flex;gap:12px}.inq-row input{flex:1;min-width:0}
  .inq input,.inq textarea{width:100%;background:#fff;border:1px solid var(--line);border-radius:12px;color:var(--ink);font-family:var(--sans);font-size:15px;letter-spacing:-.01em;padding:15px 17px;transition:border-color .25s var(--ease)}
  .inq textarea{resize:vertical;min-height:120px;line-height:1.6}
  .inq input::placeholder,.inq textarea::placeholder{color:var(--dim)}
  .inq input:focus,.inq textarea:focus{outline:none;border-color:var(--ink)}
  .inq input.err,.inq textarea.err{border-color:#C8452F}
  .btn{align-self:flex-start;margin-top:6px;display:inline-flex;align-items:center;gap:10px;background:var(--ink);color:#fff;border:0;cursor:pointer;font-family:var(--mono);font-size:13px;font-weight:500;letter-spacing:.03em;padding:16px 30px;border-radius:999px;transition:transform .3s var(--ease),opacity .3s var(--ease)}
  .btn:hover{transform:translateY(-2px);opacity:.92}
  .btn:disabled{opacity:.5;cursor:default;transform:none}
  .inq-msg{min-height:1.2em;margin:4px 0 0;font-family:var(--mono);font-size:13px;letter-spacing:0}
  .inq-msg.ok{color:#2E7D55}.inq-msg.bad{color:#C8452F}
  @media(max-width:560px){.inq-row{flex-direction:column}}
</style>
</head>
<body>

<nav>
  <a href="/" aria-label="페어웨이 홈"><span class="mk foil-mark" role="img" aria-label="PEARWAY"></span></a>
  <button class="menu-btn" id="menuOpen" aria-label="메뉴 열기">Menu <span class="bars" aria-hidden="true"><i></i><i></i></span></button>
</nav>

<div class="menu" id="menu" aria-hidden="true">
  <button class="menu-close" id="menuClose" aria-label="메뉴 닫기">Close</button>
  <nav class="menu-list">
    <a href="/brand" aria-current="page">그래픽 디자인 <span class="en">Graphic Design</span></a>
    <a href="/signage">간판 및 사이니지 <span class="en">Signage</span></a>
    <a href="https://peartype.kr">폰트 파운더리 <span class="en">Type Foundry ↗</span></a>
    <a href="/flormonde/">플로르몽드 <span class="en">Objet ↗</span></a>
    <a href="/about">소개 <span class="en">About</span></a>
  </nav>
</div>

<main>
  <section class="phead">
    <h1>그래픽 디자인</h1>
    <p class="sub">Logo, brand identity and print. <span class="dim">From mark to card.</span></p>
  </section>

  <div class="shead reveal">
    <h2>Work</h2>
    <span class="mono dim"></span>
  </div>
  <div class="g-feed">
    <figure class="g-item reveal">
      <div class="g-ph" style="aspect-ratio:4/3"></div>
      <figcaption class="g-cap"><span class="g-nm">작업명</span><span class="g-spec">용지 / 사이즈 (예: 아트지 200g / 90×50mm)</span></figcaption>
    </figure>
    <figure class="g-item reveal">
      <div class="g-ph" style="aspect-ratio:3/4"></div>
      <figcaption class="g-cap"><span class="g-nm">작업명</span><span class="g-spec">용지 / 사이즈</span></figcaption>
    </figure>
    <figure class="g-item reveal">
      <div class="g-ph" style="aspect-ratio:1/1"></div>
      <figcaption class="g-cap"><span class="g-nm">작업명</span><span class="g-spec">용지 / 사이즈</span></figcaption>
    </figure>
    <figure class="g-item reveal">
      <div class="g-ph" style="aspect-ratio:3/4"></div>
      <figcaption class="g-cap"><span class="g-nm">작업명</span><span class="g-spec">용지 / 사이즈</span></figcaption>
    </figure>
  </div>
</main>

<footer id="contact">
  <div class="f-top">
    <div class="f-biz">
      <span><a href="mailto:ppearwayy@gmail.com">ppearwayy@gmail.com</a></span>
      <span><a href="https://instagram.com/thisispearway">@thisispearway</a></span>
    </div>
    <form class="f-inq" id="inq-form" data-source="brand" novalidate>
      <div class="f-inq-h">문의하기 <span>Contact</span></div>
      <div class="f-inq-row">
        <input type="text" id="inq-name" name="name" placeholder="성함 / 업체명" autocomplete="name" required>
        <input type="text" id="inq-contact" name="contact" placeholder="연락처 (전화 또는 이메일)" required>
      </div>
      <textarea id="inq-message" name="message" rows="2" placeholder="어떤 작업을 고민 중이신가요?"></textarea>
      <button type="submit" class="f-inq-btn" id="inq-submit">문의 남기기 <span aria-hidden="true">↗</span></button>
      <p class="inq-msg" id="inq-msg" role="status" aria-live="polite"></p>
    </form>
  </div>
  <div class="f-copy">© 2026 PEARWAY</div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/lenis@1.1.20/dist/lenis.min.js"></script>
<script src="pearway.js?v=2"></script>

</body>
</html>
