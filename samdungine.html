<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>삼둥이네 푸줏간 / PEARWAY</title>
<meta name="description" content="삼둥이네 푸줏간 한우 브랜드 아이덴티티. 로고부터 명함, 패키지, 쇼핑백, 매장 간판까지. 페어웨이 작업.">
<meta property="og:title" content="삼둥이네 푸줏간 / PEARWAY">
<meta property="og:description" content="로고부터 명함, 패키지, 쇼핑백, 매장 간판까지. 하나로 묶은 한우 정육점 브랜드.">
<meta property="og:type" content="website">
<meta property="og:image" content="images/works/samdungine/facade.jpg">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" as="style" crossorigin
  href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="pearway.css?v=2">
<link rel="icon" type="image/svg+xml" href="favicon.svg">

<style>
  .g-wrap{max-width:1120px;margin:0 auto;padding:0 var(--pad)}

  .g-intro{padding:calc(clamp(44px,6vw,70px) + clamp(28px,4vw,48px)) 0 clamp(26px,4vw,48px);text-align:center}
  .g-back{font-family:var(--mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);display:inline-block;margin-bottom:clamp(30px,5vw,58px)}
  .g-back:hover{color:var(--ink)}
  .g-logo{margin:0 auto clamp(26px,4vw,42px);width:min(300px,62%)}
  .g-logo img{width:100%;height:auto;display:block;border-radius:12px}
  .g-intro h1{margin:0;font-weight:600;letter-spacing:-.04em;line-height:1.05;font-size:clamp(1.9rem,4vw,2.6rem)}
  .g-intro h1 span{opacity:.5}
  .g-lead{margin:clamp(14px,2vw,20px) auto 0;max-width:44ch;color:var(--dim);font-size:clamp(1rem,1.3vw,1.14rem);line-height:1.62}

  /* 홈처럼 리듬: 2열 스태거, 자연비율, 여백 */
  .g-flow{display:grid;grid-template-columns:1fr 1fr;gap:clamp(40px,6vw,88px) clamp(18px,3vw,44px);align-items:start;padding:clamp(24px,4vw,52px) 0 clamp(60px,10vw,120px)}
  .g-pc{margin:0;min-width:0}
  .g-pc:nth-child(even){margin-top:clamp(32px,6vw,90px)}
  .g-pc img{width:100%;height:auto;display:block;border-radius:12px;background:var(--ph)}
  .g-cap{margin-top:12px;font-family:var(--mono);font-size:11.5px;letter-spacing:.04em;color:var(--dim)}
  @media(max-width:620px){.g-flow{grid-template-columns:1fr;gap:clamp(36px,9vw,56px)}.g-pc:nth-child(even){margin-top:0}}

  .g-end{display:flex;flex-wrap:wrap;gap:18px 40px;justify-content:space-between;align-items:baseline;
    padding:clamp(40px,6vw,80px) 0 clamp(30px,4vw,56px);border-top:1px solid var(--line)}
  .g-end a{font-weight:600;letter-spacing:-.03em;font-size:clamp(1.3rem,2.4vw,1.8rem)}
</style>
</head>
<body>

<nav>
  <a href="/" aria-label="페어웨이 홈"><span class="mk foil-mark" role="img" aria-label="PEARWAY"></span></a>
  <button class="menu-btn" id="menuOpen" aria-label="메뉴 열기">Menu <span class="bars" aria-hidden="true"><i></i><i></i></span></button>
</nav>

<div class="menu" id="menu" aria-hidden="true">
  <button class="menu-close" id="menuClose" aria-label="메뉴 닫기">Close</button>
  <nav class="menu-list">
    <a href="/brand">그래픽 디자인 <span class="en">Graphic Design</span></a>
    <a href="/signage">간판 및 사이니지 <span class="en">Signage</span></a>
    <a href="https://peartype.kr">폰트 파운더리 <span class="en">Type Foundry ↗</span></a>
    <a href="/flormonde/">플로르몽드 <span class="en">Objet ↗</span></a>
    <a href="/about">소개 <span class="en">About</span></a>
  </nav>
</div>

<main>
  <div class="g-wrap">
    <section class="g-intro reveal">
      <a class="g-back" href="/brand">← Graphic Design</a>
      <div class="g-logo"><img src="images/works/samdungine/card.jpg" alt="삼둥이네 푸줏간 로고"></div>
      <h1>삼둥이네 푸줏간 <span>SAMDUNGINE</span></h1>
      <p class="g-lead">로고부터 명함, 패키지, 쇼핑백, 매장 간판까지. 하나로 묶은 한우 정육점 브랜드.</p>
    </section>

    <div class="g-flow">
      <figure class="g-pc reveal"><img src="images/works/samdungine/cards.jpg" alt="삼둥이네 푸줏간 명함"><figcaption class="g-cap">명함 / Business Card</figcaption></figure>
      <figure class="g-pc reveal"><img src="images/works/samdungine/package.jpg" alt="삼둥이네 푸줏간 한우 패키지"><figcaption class="g-cap">패키지 / Package</figcaption></figure>
      <figure class="g-pc reveal"><img src="images/works/samdungine/package2.jpg" alt="삼둥이네 푸줏간 한우 등심 패키지"><figcaption class="g-cap">한우 등심 패키지 / Package</figcaption></figure>
      <figure class="g-pc reveal"><img src="images/works/samdungine/bag.jpg" alt="삼둥이네 푸줏간 쇼핑백"><figcaption class="g-cap">쇼핑백 / Shopping Bag</figcaption></figure>
      <figure class="g-pc reveal"><img src="images/works/samdungine/logo-concept.jpg" alt="삼둥이네 푸줏간 로고 콘셉트"><figcaption class="g-cap">로고 콘셉트 / Logo Concept</figcaption></figure>
      <figure class="g-pc reveal"><img src="images/works/samdungine/facade.jpg" alt="삼둥이네 푸줏간 매장 간판"><figcaption class="g-cap">매장 간판 / Storefront</figcaption></figure>
    </div>

    <div class="g-end">
      <a href="/brand">← Graphic Design</a>
      <a href="/signage">Signage →</a>
    </div>
  </div>
</main>

<footer>
  <div class="f-top">
    <div class="f-biz">
      <span><a href="mailto:ppearwayy@gmail.com">ppearwayy@gmail.com</a></span>
      <span><a href="https://instagram.com/thisispearway">@thisispearway</a></span>
    </div>
    <form class="f-inq" id="inq-form" data-source="samdungine" novalidate>
      <div class="f-inq-h">문의하기 <span>Contact</span></div>
      <div class="f-inq-row">
        <input type="text" id="inq-name" name="name" placeholder="성함 / 업체명" autocomplete="name" required>
        <input type="text" id="inq-contact" name="contact" placeholder="연락처 (전화 또는 이메일)" required>
      </div>
      <textarea id="inq-message" name="message" rows="2" placeholder="어떤 작업을 고민 중이신가요?"></textarea>
      <button type="submit" class="f-inq-btn" id="inq-submit">문의 남기기 <span aria-hidden="true">↗</span></button>
      <p class="inq-msg" id="inq-msg" role="status" aria-live="polite"></p>
    </form>
  </div>
  <div class="f-copy">© 2026 PEARWAY</div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/lenis@1.1.20/dist/lenis.min.js"></script>
<script src="pearway.js?v=2"></script>
</body>
</html>
