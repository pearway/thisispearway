<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
@font-face{
  font-family:'Distort';
  src:url(fonts/Distort-Bold.woff2) format('woff2');
  font-weight:700;
  font-display:swap;
}
:root{
  --brand-bg:#FAFAF7; --brand-ink:#0C0C0B; --brand-ink2:#4A4A47; --brand-ink3:#8A8A85;
  --type-bg:#0C0C0B; --type-ink:#FAFAF7; --type-ink2:#B9B9B4; --type-ink3:#6E6E69;
  --line:#DEDED8;
  --font-sans:'Google Sans','Roboto','Pretendard Variable',system-ui,sans-serif;
  --font-mono:'Roboto Mono',ui-monospace,monospace;
  --font-word:'Distort','Pretendard Variable',sans-serif;
  --ease:cubic-bezier(0.22,1,0.36,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-font-smoothing:antialiased}
body{font-family:var(--font-sans);overflow:hidden}
a{color:inherit;text-decoration:none}

.gate{display:flex;width:100vw;height:100dvh}
.half{
  flex:1;position:relative;
  display:flex;flex-direction:column;justify-content:space-between;
  padding:clamp(1.4rem,3.5vw,2.75rem);
  transition:flex .6s var(--ease),background .3s var(--ease);
  overflow:hidden;
}
.brand{background:var(--brand-bg);color:var(--brand-ink)}
.type{background:var(--type-bg);color:var(--type-ink)}

@media(hover:hover) and (min-width:721px){
  .gate:hover .half{flex:.8}
  .gate .half:hover{flex:1.55}
}

.meta{
  display:flex;justify-content:space-between;align-items:baseline;
  font-family:var(--font-mono);font-size:clamp(.6rem,1vw,.72rem);
  letter-spacing:.08em;text-transform:uppercase;
}
.brand .meta{color:var(--brand-ink3)}
.type .meta{color:var(--type-ink3)}

.center{flex:1;display:flex;flex-direction:column;justify-content:center}
.word{
  font-family:var(--font-word);font-weight:700;line-height:.98;letter-spacing:.01em;
}
.brand .word{font-size:clamp(3rem,7vw,6rem);color:var(--brand-ink)}
.type .word{font-size:clamp(2.3rem,5.4vw,4.6rem);color:var(--type-ink)}
.sub{
  margin-top:clamp(.9rem,1.6vw,1.4rem);
  font-size:clamp(.82rem,1.2vw,.95rem);line-height:1.55;max-width:26ch;
}
.brand .sub{color:var(--brand-ink2)}
.type .sub{color:var(--type-ink2)}

.enter{
  display:inline-flex;align-items:center;gap:.5rem;
  font-family:var(--font-sans);font-weight:500;
  font-size:clamp(.78rem,1.1vw,.9rem);letter-spacing:.01em;
  transition:gap .3s var(--ease);
}
.half:hover .enter{gap:.85rem}
.enter svg{width:1em;height:1em;stroke:currentColor;stroke-width:1.6;fill:none}

.divider{width:.5px;background:var(--line);flex:0 0 auto}

@media(max-width:720px){
  body{overflow:auto}
  .gate{flex-direction:column;height:auto;min-height:100dvh}
  .half{min-height:50dvh;padding:1.6rem 1.4rem}
  .type .word{font-size:clamp(2.6rem,10vw,4rem)}
  .brand .word{font-size:clamp(3.2rem,13vw,5rem)}
  .divider{width:auto;height:.5px}
}
</style>
</head>
<body>
<main class="gate" role="navigation" aria-label="페어웨이 진입 선택">
  <a class="half brand" href="/brand">
    <div class="meta"><span>01 / Studio</span><span>Seoul</span></div>
    <div class="center">
      <div class="word">페어<br>웨이</div>
      <p class="sub">브랜드 · 그래픽 · 공간 디자인</p>
    </div>
    <span class="enter">브랜딩 사이트로
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
    </span>
  </a>
  <div class="divider" aria-hidden="true"></div>
  <a class="half type" href="https://peartype.kr">
    <div class="meta"><span>02 / Type</span><span>peartype.kr</span></div>
    <div class="center">
      <div class="word">페어타입<br>파운더리</div>
      <p class="sub">폰트 디자인 · 리테일 서체 파운더리</p>
    </div>
    <span class="enter">폰트 사이트로
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 17L17 7M8 7h9v9"/></svg>
    </span>
  </a>
</main>
</body>
</html>
