<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PEARWAY 페어웨이</title>

<meta name="description" content="페어웨이(PEARWAY). 공간과 그래픽, 간판과 사이니지, 폰트 파운더리 페어타입, 그리고 오브제 브랜드 플로르몽드.">
<meta name="keywords" content="페어웨이, pearway, 브랜딩, 공간 디자인, 간판, 사이니지, 페어타입파운더리, peartype, 폰트, 플로르몽드, 서울 디자이너">
<meta name="author" content="PEARWAY">
<meta name="google-site-verification" content="v6Rr_eNrXPQ4uCe9w3zBydVGey0wrflSztb3m6UqTh0">
<meta name="naver-site-verification" content="4e4c9c72ee42dd8ae6e03cc188e34dc50e64ec45">

<meta property="og:type" content="website">
<meta property="og:url" content="https://www.pearway.kr">
<meta property="og:title" content="PEARWAY 페어웨이">
<meta property="og:description" content="공간과 그래픽, 간판과 사이니지, 폰트 파운더리, 그리고 플로르몽드.">
<meta property="og:image" content="https://www.pearway.kr/images/og-thumbnail.jpg">

<link rel="canonical" href="https://www.pearway.kr">
<link rel="icon" type="image/svg+xml" href="favicon.svg">

<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" as="style" crossorigin
  href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">

<style>
:root{
  --plum:#17121A; --cream:#FBF6EC; --pink:#FA9DCD; --dim:#9a8ea2;
  --font:'Pretendard Variable',system-ui,sans-serif;
  --ease:cubic-bezier(.22,1,.36,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--plum);color:var(--cream);font-family:var(--font);overflow:hidden}
a{color:inherit;text-decoration:none}
.sronly{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}

/* 파티클: 사진 그리드 위에 중앙으로 흐름 */
#bg{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:2;pointer-events:none}

/* 4분할 사진 게이트 */
.gate{position:relative;z-index:1;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;
  width:100vw;height:100vh;height:100svh}
.quad{position:relative;overflow:hidden;background:#1b151f}
.quad img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scale(1.01);
  transition:transform 1.1s var(--ease),opacity .6s}
.quad::after{content:'';position:absolute;inset:0;background:rgba(20,15,24,.5);transition:background .45s var(--ease)}
.quad .label{position:absolute;z-index:3;padding:clamp(1.4rem,3.2vw,2.6rem);display:flex;flex-direction:column;gap:7px}
.quad .name{display:inline-flex;align-items:center;gap:9px;font-size:clamp(1.02rem,1.5vw,1.34rem);
  font-weight:600;letter-spacing:-.01em;color:var(--cream);transition:gap .35s var(--ease)}
.quad .ar{font-size:.85em;opacity:.85}
.quad .sub{font-size:11px;font-weight:500;letter-spacing:.18em;text-transform:uppercase;color:var(--dim)}
.quad .soon{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);opacity:.6}

.q-tl .label{top:0;left:0}
.q-tr .label{top:0;right:0;align-items:flex-end;text-align:right}
.q-bl .label{bottom:0;left:0}
.q-br .label{bottom:0;right:0;align-items:flex-end;text-align:right}

@media(hover:hover){
  .quad:hover img{transform:scale(1.06)}
  .quad:hover::after{background:rgba(20,15,24,.2)}
  .gate:hover .quad:not(:hover)::after{background:rgba(20,15,24,.7)}
}
.quad:hover .name{gap:14px}
.quad.flor:hover .name{color:#FFB7D8}

.masthead{position:fixed;top:clamp(1.2rem,3vw,2rem);left:50%;transform:translateX(-50%);z-index:4;pointer-events:none}
.masthead .mark{height:clamp(26px,4vh,36px);width:auto;display:block}

@media(max-width:640px){
  .gate{grid-template-columns:1fr;grid-template-rows:repeat(4,1fr)}
  .quad .label{top:auto;bottom:0;left:0;right:auto;align-items:flex-start;text-align:left}
  .masthead{top:14px}
}
</style>
</head>
<body>
<h1 class="sronly">페어웨이. 공간과 그래픽, 간판과 사이니지, 폰트 파운더리 페어타입, 오브제 브랜드 플로르몽드.</h1>
<canvas id="bg" aria-hidden="true"></canvas>
<div class="masthead" aria-hidden="true">
  <img class="mark" src="images/pearway-mark.png" alt="" width="660" height="592">
</div>
<main class="gate" role="navigation" aria-label="페어웨이 진입 선택">

  <a class="quad q-tl" href="/brand">
    <img src="images/works/duomo-pizza/g3.jpg" alt="" loading="eager">
    <span class="label">
      <span class="sub">Space &amp; Graphic</span>
      <span class="name">공간 및 그래픽 <span class="ar" aria-hidden="true">&rarr;</span></span>
    </span>
  </a>

  <a class="quad q-tr" href="/signage">
    <img src="images/works/mini-warehouse-darak/cover.jpg" alt="" loading="eager">
    <span class="label">
      <span class="sub">Signage</span>
      <span class="name">간판 및 사이니지 <span class="ar" aria-hidden="true">&rarr;</span></span>
    </span>
  </a>

  <a class="quad q-bl" href="https://peartype.kr">
    <img src="images/home/type-book.jpg" alt="" loading="eager">
    <span class="label">
      <span class="sub">Type Foundry</span>
      <span class="name">폰트 파운더리 <span class="ar" aria-hidden="true">&#8599;</span></span>
    </span>
  </a>

  <a class="quad q-br flor" href="/flormonde/">
    <img src="flormonde/img/hero-poppy1.jpg" alt="" loading="eager">
    <span class="label">
      <span class="sub">Objet</span>
      <span class="name">플로르몽드 <span class="ar" aria-hidden="true">&rarr;</span></span>
    </span>
  </a>

</main>
<script>
(function(){
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion:reduce)').matches;
  if(reduce) return;
  var cv=document.getElementById('bg'); if(!cv||!cv.getContext) return;
  var ctx=cv.getContext('2d'), DPR=Math.min(2,window.devicePixelRatio||1), W=0,H=0, parts=[], mx=-9999,my=-9999;
  function size(){ W=window.innerWidth; H=window.innerHeight; cv.width=W*DPR; cv.height=H*DPR; ctx.setTransform(DPR,0,0,DPR,0,0);
    var n=Math.min(6000, Math.max(2400, Math.floor(W*H/520)));
    var rx=Math.min(W*0.30, 520), ry=Math.min(H*0.22, 300);
    parts=[];
    for(var i=0;i<n;i++){
      var a=Math.random()*6.2832, rr=Math.pow(Math.random(),0.65);
      var hx=W/2 + Math.cos(a)*rr*rx, hy=H/2 + Math.sin(a)*rr*ry;
      parts.push({ hx:hx, hy:hy, x:hx, y:hy, vx:0, vy:0, r:Math.random()*1.1+.6, tone:Math.random(),
        ph:Math.random()*6.2832, spd:0.3+Math.random()*0.55, orb:30+Math.random()*70 }); }
  }
  var T0=null;
  function frame(ts){
    if(T0===null)T0=ts; var el=(ts-T0)/1000;
    var cursor = mx>-9000, MAGR=Math.min(W,H)*0.62, ATTR=2.4, CORE=Math.min(W,H)*0.09;
    ctx.clearRect(0,0,W,H);
    for(var i=0;i<parts.length;i++){ var p=parts[i];
      var tx=p.hx+Math.cos(el*p.spd+p.ph)*p.orb, ty=p.hy+Math.sin(el*p.spd*0.9+p.ph)*p.orb*0.7;
      p.vx += (tx-p.x)*0.010; p.vy += (ty-p.y)*0.010;
      if(cursor){ var dx=mx-p.x, dy=my-p.y, dd=Math.sqrt(dx*dx+dy*dy)+0.01;
        if(dd<MAGR){ var pull=ATTR*(1-dd/MAGR); if(dd<CORE) pull*=dd/CORE; p.vx+=(dx/dd)*pull; p.vy+=(dy/dd)*pull; } }
      p.vx*=0.86; p.vy*=0.86; p.x+=p.vx; p.y+=p.vy;
      var side=p.hx/W, mixp=Math.min(1,Math.max(0, side*0.7 + p.tone*0.3));
      var r=Math.round(251+(250-251)*mixp), g=Math.round(246+(157-246)*mixp), b=Math.round(236+(205-236)*mixp);
      ctx.fillStyle='rgb('+r+','+g+','+b+')';
      ctx.fillRect(p.x, p.y, p.r*1.6, p.r*1.6);
    }
    requestAnimationFrame(frame);
  }
  window.addEventListener('mousemove',function(e){ mx=e.clientX; my=e.clientY; });
  window.addEventListener('mouseout',function(){ mx=-9999; my=-9999; });
  window.addEventListener('touchmove',function(e){ if(e.touches[0]){ mx=e.touches[0].clientX; my=e.touches[0].clientY; } },{passive:true});
  var rt; window.addEventListener('resize',function(){ clearTimeout(rt); rt=setTimeout(size,180); });
  size(); requestAnimationFrame(frame);
})();
</script>
</body>
</html>
