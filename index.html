  href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">

<style>
@font-face{
  font-family:'Distort';
  src:url(fonts/Distort-Bold.woff2) format('woff2');
  font-weight:700; font-display:swap;
}
:root{
  --plum:#17121A; --cream:#FBF6EC; --pink:#FA9DCD;
  --font:'Pretendard Variable',system-ui,sans-serif;
  --word:'Distort','Pretendard Variable',sans-serif;
  --ease:cubic-bezier(.22,1,.36,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--plum);color:var(--cream);font-family:var(--font);overflow:hidden}
a{color:inherit;text-decoration:none}
.sronly{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}

.gate{display:flex;width:100vw;height:100vh;height:100dvh}
.half{flex:1;position:relative;display:flex;flex-direction:column;justify-content:center;
  padding:clamp(1.6rem,4vw,3rem);transition:flex-basis .5s var(--ease),opacity .4s var(--ease)}
.hL{background:var(--plum)}
.hR{align-items:flex-end;text-align:right;border-left:.5px solid rgba(251,246,236,.14)}

.wm{font-family:var(--word);font-weight:700;line-height:1.14;letter-spacing:.01em}
.hL .wm{font-size:clamp(2.6rem,7vw,6rem);color:var(--cream)}
.hR .wm{font-size:clamp(2rem,5.2vw,4.4rem);color:var(--pink)}

.enter{margin-top:clamp(1rem,2vw,1.6rem);display:inline-flex;align-items:center;gap:9px;
  font-size:clamp(.92rem,1.15vw,1.05rem);font-weight:500;letter-spacing:-.01em;
  transition:gap .35s var(--ease)}
.enter .ar{font-size:.9em}
.enter::after{content:'';position:absolute;left:0;right:0;bottom:-4px;height:1px;background:currentColor;
  transform:scaleX(1);transform-origin:left;opacity:.4;transition:opacity .3s}
.hL .enter{color:var(--cream)}.hR .enter{color:var(--pink)}
.enter{position:relative}
.hR .enter::after{transform-origin:right}
.half:hover .enter{gap:14px}
.half:hover .enter::after{opacity:1}

/* hovering one side gently recedes the other — subtle, CSS-only, cannot break */
@media (hover:hover){
  .gate:hover .half{opacity:.5}
  .gate .half:hover{opacity:1;flex-grow:1.25}
}

@media (max-width:720px){
  body{overflow:auto}
  .gate{flex-direction:column;height:auto;min-height:100dvh}
  .half{min-height:50dvh}
  .hR{text-align:left;align-items:flex-start;border-left:0;border-top:.5px solid rgba(251,246,236,.14)}
  .hL .wm{font-size:clamp(3rem,15vw,5rem)}
  .hR .wm{font-size:clamp(2.4rem,11vw,4rem)}
  .gate:hover .half{opacity:1}
}
</style>
</head>
<body>
<h1 class="sronly">페어웨이 — 브랜딩 스튜디오, 그리고 페어타입파운더리 — 폰트 파운더리</h1>
<main class="gate" role="navigation" aria-label="페어웨이 진입 선택">
  <a class="half hL" href="/brand">
    <span class="wm">페어웨이</span>
    <span class="enter">브랜딩 스튜디오 <span class="ar" aria-hidden="true">&rarr;</span></span>
  </a>
  <a class="half hR" href="https://peartype.kr">
    <span class="wm">페어타입파운더리</span>
    <span class="enter">타입 파운더리 <span class="ar" aria-hidden="true">&#8599;</span></span>
  </a>
</main>
</body>
</html>
