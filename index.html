<!DOCTYPE html>

<head>

<meta property="og:description" content="브랜딩은 페어웨이, 타입은 페어타입파운더리. 두 갈래로 이어집니다.">

<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" as="style" crossorigin
  href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">

<style>
@font-face{
  font-family:'Distort';
  src:url(fonts/Distort-Bold.woff2) format('woff2');
  font-weight:700; font-display:swap;
}
:root{
  --plum:#17121A; --cream:#FBF6EC; --pink:#FA9DCD; --dim:#8a7f88;
  --font:'Pretendard Variable',system-ui,sans-serif;
  --word:'Distort','Pretendard Variable',sans-serif;
  --ease:cubic-bezier(.22,1,.36,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--plum);color:var(--cream);font-family:var(--font);overflow:hidden}
a{color:inherit;text-decoration:none}
.sronly{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}

.stage{position:relative;width:100vw;height:100vh;height:100svh;overflow:hidden}
#pcv{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none}

.half{position:absolute;top:0;bottom:0;width:50%;display:flex;flex-direction:column;justify-content:flex-end;
  padding:clamp(1.6rem,4vw,3rem);z-index:2}
.hL{left:0;align-items:flex-start}
.hR{right:0;align-items:flex-end;text-align:right}

/* static name — only shown as fallback (touch / no-JS / reduced-motion); hidden while particles run */
.wm{font-family:var(--word);font-weight:700;line-height:1.14;letter-spacing:.01em;margin-bottom:.6rem}
.hL .wm{font-size:clamp(2.4rem,6vw,4rem);color:var(--cream)}
.hR .wm{font-size:clamp(1.9rem,4.6vw,3.4rem);color:var(--pink)}
.stage.js .wm{display:none}

.enter{position:relative;display:inline-flex;align-items:center;gap:8px;
  font-size:clamp(.85rem,1.05vw,.98rem);font-weight:500;letter-spacing:-.01em;color:var(--dim);
  transition:gap .35s var(--ease),color .3s}
.enter .ar{font-size:.9em}
.enter::after{content:'';position:absolute;left:0;right:0;bottom:-4px;height:1px;background:currentColor;
  opacity:.35;transform-origin:left;transition:opacity .3s}
.hR .enter::after{transform-origin:right}
.half:hover .enter{gap:13px}
.hL:hover .enter{color:var(--cream)}
.hR:hover .enter{color:var(--pink)}
.half:hover .enter::after{opacity:1}

.vig{position:absolute;top:0;bottom:0;width:54%;pointer-events:none;opacity:0;transition:opacity .35s;z-index:1}
.vL{left:0;background:radial-gradient(120% 90% at 8% 50%,rgba(251,246,236,.08),transparent 60%)}
.vR{right:0;background:radial-gradient(120% 90% at 92% 50%,rgba(250,157,205,.10),transparent 60%)}
.hL:hover ~ .vL{opacity:1}.hR:hover ~ .vR{opacity:1}

@media (max-width:720px){
  body{overflow:auto}
  #pcv{display:none}
  .stage{height:auto;min-height:100svh;overflow:visible}
  .half{position:static;width:100%;min-height:50svh;justify-content:center;gap:.4rem}
  .hR{text-align:left;align-items:flex-start}
  .hL{border-bottom:.5px solid rgba(251,246,236,.12)}
  .stage.js .wm{display:block}
  .hL .wm{font-size:clamp(3rem,15vw,5rem)}
  .hR .wm{font-size:clamp(2.4rem,11vw,4rem)}
}
@media (prefers-reduced-motion:reduce){
  #pcv{display:none}
  .stage.js .wm{display:block}
}
</style>
</head>
<body>
<h1 class="sronly">페어웨이 — 브랜딩 스튜디오, 그리고 페어타입파운더리 — 폰트 파운더리</h1>
<main class="stage" id="stage" role="navigation" aria-label="페어웨이 진입 선택">
  <canvas id="pcv" aria-hidden="true"></canvas>
  <a class="half hL" href="/brand">
    <span class="wm">페어웨이</span>
    <span class="enter">브랜딩 스튜디오 <span class="ar" aria-hidden="true">&rarr;</span></span>
  </a>
  <a class="half hR" href="https://peartype.kr">
    <span class="wm">페어타입파운더리</span>
    <span class="enter">타입 파운더리 <span class="ar" aria-hidden="true">&#8599;</span></span>
  </a>
  <div class="vig vL" aria-hidden="true"></div><div class="vig vR" aria-hidden="true"></div>
</main>
<script>
(function(){
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion:reduce)').matches;
  var fine = window.matchMedia && window.matchMedia('(hover:hover) and (pointer:fine)').matches;
  var force = /[?&]force/.test(location.search);
  if(!force && (reduce || !fine || window.innerWidth<=720)) return;   // static fallback stays

  var cv=document.getElementById('pcv'), stage=document.getElementById('stage');
  if(!cv||!cv.getContext) return;
  var ctx=cv.getContext('2d'), DPR=Math.min(2,window.devicePixelRatio||1), W=0,H=0;
  function size(){ var r=cv.getBoundingClientRect(); W=Math.round(r.width); H=Math.round(r.height); cv.width=W*DPR; cv.height=H*DPR; ctx.setTransform(DPR,0,0,DPR,0,0); }
  function sample(txt){
    // draw into a TALL offscreen canvas so no part of the glyph is ever clipped while sampling
    var SH=Math.round(H*1.8);
    var oc=document.createElement('canvas'); oc.width=W; oc.height=SH; var o=oc.getContext('2d');
    o.textAlign='center'; o.textBaseline='middle'; o.fillStyle='#fff';
    // auto-fit: shrink until the glyph box fits within safe margins of the REAL height
    var maxW=W*0.84, maxH=H*0.36, fs=Math.min(H*0.19, W*0.9/(txt.length*0.6));
    for(var k=0;k<7;k++){
      o.font='700 '+fs+'px Distort';
      var m=o.measureText(txt);
      var tw=m.width, th=(m.actualBoundingBoxAscent||fs*0.85)+(m.actualBoundingBoxDescent||fs*0.35);
      if(tw<=maxW && th<=maxH) break;
      fs *= Math.min(maxW/tw, maxH/th) * 0.96;
    }
    o.font='700 '+fs+'px Distort';
    o.fillText(txt, W/2, SH/2);
    // collect ink, then recentre by its ACTUAL bounding box → true screen centre, immune to font metrics/baseline
    var dd=o.getImageData(0,0,W,SH).data, pts=[], g=4, minX=1e9,maxX=-1e9,minY=1e9,maxY=-1e9;
    for(var y=0;y<SH;y+=g)for(var x=0;x<W;x+=g){ if(dd[(y*W+x)*4+3]>128){ pts.push([x,y]); if(x<minX)minX=x; if(x>maxX)maxX=x; if(y<minY)minY=y; if(y>maxY)maxY=y; } }
    if(pts.length){ var dxc=W/2-(minX+maxX)/2, dyc=H/2-(minY+maxY)/2;
      for(var i=0;i<pts.length;i++){ pts[i][0]+=dxc; pts[i][1]+=dyc; } }
    return pts;
  }
  var COUNT=0, parts=[], A=[],B=[], mx=-9999,my=-9999, t=0,tTarget=0, inside=false, ready=false, T0=null;
  function build(){
    size(); if(!W||!H) return false;
    A=sample('페어웨이'); B=sample('페어타입파운더리');
    if(!A.length||!B.length) return false;
    COUNT=Math.min(3000, Math.max(1400, Math.floor(W*H/460)));
    parts=[];
    for(var i=0;i<COUNT;i++){ var a=A[i%A.length], b=B[i%B.length];
      parts.push({x:Math.random()*W,y:Math.random()*H,
        ax:a[0]+(Math.random()-.5)*2, ay:a[1]+(Math.random()-.5)*2,
        bx:b[0]+(Math.random()-.5)*2, by:b[1]+(Math.random()-.5)*2,
        vx:0,vy:0, r:Math.random()*1.1+.6, tone:Math.random()}); }
    return true;
  }
  function frame(ts){
    if(T0===null)T0=ts; var el=(ts-T0)/1000;
    if(inside){ tTarget = mx < W*0.5 ? 0 : 1; } else { tTarget = 0.5+0.5*Math.sin(el*0.6); }
    t += (tTarget-t)*0.06; ctx.clearRect(0,0,W,H);
    for(var i=0;i<parts.length;i++){ var p=parts[i];
      var tx=p.ax+(p.bx-p.ax)*t, ty=p.ay+(p.by-p.ay)*t;
      p.vx+=(tx-p.x)*0.02; p.vy+=(ty-p.y)*0.02;
      var dx=p.x-mx, dy=p.y-my, q=dx*dx+dy*dy;
      if(q<9000){ var f=(9000-q)/9000, d=Math.sqrt(q)||1; p.vx+=(dx/d)*f*3.6; p.vy+=(dy/d)*f*3.6; }
      p.vx*=0.86; p.vy*=0.86; p.x+=p.vx; p.y+=p.vy;
      var mc=Math.min(1,Math.max(0,t+(p.tone-.5)*.25));
      var r=Math.round(251+(250-251)*mc), gg=Math.round(246+(157-246)*mc), bb=Math.round(236+(205-236)*mc);
      ctx.fillStyle='rgb('+r+','+gg+','+bb+')'; ctx.fillRect(p.x,p.y,p.r*1.6,p.r*1.6);
    }
    requestAnimationFrame(frame);
  }
  stage.addEventListener('mouseenter',function(){ inside=true; });
  stage.addEventListener('mousemove',function(e){ var r=stage.getBoundingClientRect(); mx=e.clientX-r.left; my=e.clientY-r.top; inside=true; });
  stage.addEventListener('mouseleave',function(){ inside=false; mx=-9999; my=-9999; });
  var startFn=function(){
    if(build()){ stage.classList.add('js'); ready=true; requestAnimationFrame(frame); }
    else { setTimeout(function(){ if(!ready && build()){ stage.classList.add('js'); ready=true; requestAnimationFrame(frame); } }, 250); }
  };
  (document.fonts && document.fonts.load ? document.fonts.load('700 100px "Distort"','페어타입파운더리웨이').then(function(){return document.fonts.ready;}) : Promise.resolve())
    .then(startFn).catch(startFn);
  var rt; window.addEventListener('resize',function(){ if(!ready)return; clearTimeout(rt); rt=setTimeout(build,180); });
})();
</script>
</body>
</html>
