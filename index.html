<style>
@font-face{
  font-family:'Distort';
  src:url(fonts/Distort-Bold.woff2) format('woff2');
  font-weight:700; font-display:swap;
}
:root{
  --plum:#17121A; --cream:#FBF6EC; --pink:#FA9DCD;
  --font:'Pretendard Variable',system-ui,sans-serif;
  --word:'Distort','Pretendard Variable',sans-serif;
  --ease:cubic-bezier(.22,1,.36,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--plum);color:var(--cream);font-family:var(--font);overflow:hidden}
a{color:inherit;text-decoration:none}
.sronly{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}

#bg{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:0;pointer-events:none}

.gate{position:relative;z-index:1;display:flex;width:100vw;height:100vh;height:100dvh}
.half{flex:1;position:relative;display:flex;flex-direction:column;justify-content:center;
  padding:clamp(1.6rem,4vw,3rem);transition:flex-grow .5s var(--ease),opacity .4s var(--ease)}
.hR{align-items:flex-end;text-align:right;border-left:.5px solid rgba(251,246,236,.14)}

.wm{font-family:var(--word);font-weight:700;line-height:1.14;letter-spacing:.01em}
.hL .wm{font-size:clamp(2.6rem,7vw,6rem);color:var(--cream)}
.hR .wm{font-size:clamp(2rem,5.2vw,4.4rem);color:var(--pink)}

.enter{margin-top:clamp(1rem,2vw,1.6rem);position:relative;display:inline-flex;align-items:center;gap:9px;
  font-size:clamp(.92rem,1.15vw,1.05rem);font-weight:500;letter-spacing:-.01em;transition:gap .35s var(--ease)}
.enter .ar{font-size:.9em}
.enter::after{content:'';position:absolute;left:0;right:0;bottom:-4px;height:1px;background:currentColor;
  opacity:.4;transform-origin:left;transition:opacity .3s}
.hR .enter::after{transform-origin:right}
.hL .enter{color:var(--cream)}.hR .enter{color:var(--pink)}
.half:hover .enter{gap:14px}
.half:hover .enter::after{opacity:1}

@media (hover:hover){
  .gate:hover .half{opacity:.55}
  .gate .half:hover{opacity:1;flex-grow:1.25}
}

@media (max-width:720px){
  body{overflow:auto}
  .gate{flex-direction:column;height:auto;min-height:100dvh}
  .half{min-height:50dvh}
  .hR{text-align:left;align-items:flex-start;border-left:0;border-top:.5px solid rgba(251,246,236,.14)}
  .hL .wm{font-size:clamp(3rem,15vw,5rem)}
  .hR .wm{font-size:clamp(2.4rem,11vw,4rem)}
  .gate:hover .half{opacity:1}
}
</style>
</head>
<body>
<h1 class="sronly">페어웨이 — 브랜딩 스튜디오, 그리고 페어타입파운더리 — 폰트 파운더리</h1>
<canvas id="bg" aria-hidden="true"></canvas>
<main class="gate" role="navigation" aria-label="페어웨이 진입 선택">
  <a class="half hL" href="/brand">
    <span class="wm">페어웨이</span>
    <span class="enter">브랜딩 스튜디오 <span class="ar" aria-hidden="true">&rarr;</span></span>
  </a>
  <a class="half hR" href="https://peartype.kr">
    <span class="wm">페어타입파운더리</span>
    <span class="enter">타입 파운더리 <span class="ar" aria-hidden="true">&#8599;</span></span>
  </a>
</main>
<script>
(function(){
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion:reduce)').matches;
  if(reduce) return;
  var cv=document.getElementById('bg'); if(!cv||!cv.getContext) return;
  var ctx=cv.getContext('2d'), DPR=Math.min(2,window.devicePixelRatio||1), W=0,H=0, parts=[], mx=-9999,my=-9999;
  function size(){ W=window.innerWidth; H=window.innerHeight; cv.width=W*DPR; cv.height=H*DPR; ctx.setTransform(DPR,0,0,DPR,0,0);
    var n=Math.min(320, Math.max(90, Math.floor(W*H/9000)));
    parts=[];
    for(var i=0;i<n;i++){ parts.push({ x:Math.random()*W, y:Math.random()*H,
      vx:(Math.random()-.5)*.28, vy:(Math.random()-.5)*.28,
      r:Math.random()*1.6+.5, tone:Math.random() }); }
  }
  function frame(){
    ctx.clearRect(0,0,W,H);
    for(var i=0;i<parts.length;i++){ var p=parts[i];
      // cursor gently pushes nearby dust
      var dx=p.x-mx, dy=p.y-my, q=dx*dx+dy*dy;
      if(q<16000){ var f=(16000-q)/16000, d=Math.sqrt(q)||1; p.vx+=(dx/d)*f*.5; p.vy+=(dy/d)*f*.5; }
      p.vx*=0.97; p.vy*=0.97; p.x+=p.vx; p.y+=p.vy;
      if(p.x<-6)p.x=W+6; if(p.x>W+6)p.x=-6; if(p.y<-6)p.y=H+6; if(p.y>H+6)p.y=-6;
      // colour echoes the two sides: left cream, right pink
      var side=p.x/W, mixp=Math.min(1,Math.max(0, side*0.7 + p.tone*0.3));
      var r=Math.round(251+(250-251)*mixp), g=Math.round(246+(157-246)*mixp), b=Math.round(236+(205-236)*mixp);
      ctx.globalAlpha=0.5+p.tone*0.35;
      ctx.fillStyle='rgb('+r+','+g+','+b+')';
      ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,6.2832); ctx.fill();
    }
    ctx.globalAlpha=1;
    requestAnimationFrame(frame);
  }
  window.addEventListener('mousemove',function(e){ mx=e.clientX; my=e.clientY; });
  window.addEventListener('mouseout',function(){ mx=-9999; my=-9999; });
  var rt; window.addEventListener('resize',function(){ clearTimeout(rt); rt=setTimeout(size,180); });
  size(); requestAnimationFrame(frame);
})();
</script>
</body>
</html>
