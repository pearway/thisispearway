<style>
:root{
  --plum:#17121A; --cream:#FBF6EC; --pink:#FA9DCD; --dim:#9a8ea2;
  --font:'Pretendard Variable',system-ui,sans-serif;
  --ease:cubic-bezier(.22,1,.36,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--plum);color:var(--cream);font-family:var(--font);overflow:hidden}
a{color:inherit;text-decoration:none}
.sronly{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}

#bg{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:0;pointer-events:none}

.gate{position:relative;z-index:1;display:flex;width:100vw;height:100vh;height:100svh}
.half{flex:1;position:relative;display:flex;flex-direction:column;justify-content:flex-end;
  padding:clamp(1.4rem,4vw,3rem);transition:opacity .4s var(--ease)}
.hR{align-items:flex-end;text-align:right;border-left:.5px solid rgba(251,246,236,.12)}

.enter{position:relative;display:inline-flex;align-items:center;gap:8px;
  font-size:clamp(.9rem,1.1vw,1.02rem);font-weight:500;letter-spacing:-.01em;color:var(--dim);
  transition:gap .35s var(--ease),color .3s}
.enter .ar{font-size:.9em}
.enter::after{content:'';position:absolute;left:0;right:0;bottom:-4px;height:1px;background:currentColor;
  opacity:.35;transform-origin:left;transition:opacity .3s}
.hR .enter::after{transform-origin:right}
.half:hover .enter{gap:13px}
.hL:hover .enter{color:var(--cream)}
.hR:hover .enter{color:var(--pink)}
.half:hover .enter::after{opacity:1}

@media (hover:hover){
  .gate:hover .half{opacity:.55}
  .gate .half:hover{opacity:1}
}
</style>
</head>
<body>
<h1 class="sronly">페어웨이 — 브랜딩 스튜디오, 그리고 페어타입파운더리 — 폰트 파운더리</h1>
<canvas id="bg" aria-hidden="true"></canvas>
<main class="gate" role="navigation" aria-label="페어웨이 진입 선택">
  <a class="half hL" href="/brand">
    <span class="enter">브랜딩 스튜디오 <span class="ar" aria-hidden="true">&rarr;</span></span>
  </a>
  <a class="half hR" href="https://peartype.kr">
    <span class="enter">타입 파운더리 <span class="ar" aria-hidden="true">&#8599;</span></span>
  </a>
</main>
<script>
(function(){
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion:reduce)').matches;
  if(reduce) return;
  var cv=document.getElementById('bg'); if(!cv||!cv.getContext) return;
  var ctx=cv.getContext('2d'), DPR=Math.min(2,window.devicePixelRatio||1), W=0,H=0, parts=[], mx=-9999,my=-9999;
  function size(){ W=window.innerWidth; H=window.innerHeight; cv.width=W*DPR; cv.height=H*DPR; ctx.setTransform(DPR,0,0,DPR,0,0);
    var n=Math.min(2600, Math.max(700, Math.floor(W*H/2200)));
    parts=[];
    for(var i=0;i<n;i++){ var hx=Math.random()*W, hy=Math.random()*H;   // each dot has a home to spring back to
      parts.push({ hx:hx, hy:hy, x:hx, y:hy, vx:0, vy:0, r:Math.random()*1.1+.6, tone:Math.random() }); }
  }
  function frame(){
    ctx.clearRect(0,0,W,H);
    for(var i=0;i<parts.length;i++){ var p=parts[i];
      p.vx += (p.hx-p.x)*0.02; p.vy += (p.hy-p.y)*0.02;                 // spring home (morph feel)
      var dx=p.x-mx, dy=p.y-my, q=dx*dx+dy*dy;
      if(q<9000){ var f=(9000-q)/9000, d=Math.sqrt(q)||1; p.vx+=(dx/d)*f*3.6; p.vy+=(dy/d)*f*3.6; }  // strong scatter
      p.vx*=0.86; p.vy*=0.86; p.x+=p.vx; p.y+=p.vy;
      var side=p.hx/W, mixp=Math.min(1,Math.max(0, side*0.7 + p.tone*0.3));
      var r=Math.round(251+(250-251)*mixp), g=Math.round(246+(157-246)*mixp), b=Math.round(236+(205-236)*mixp);
      ctx.fillStyle='rgb('+r+','+g+','+b+')';
      ctx.fillRect(p.x, p.y, p.r*1.6, p.r*1.6);                          // square dots (morph form)
    }
    requestAnimationFrame(frame);
  }
  window.addEventListener('mousemove',function(e){ mx=e.clientX; my=e.clientY; });
  window.addEventListener('mouseout',function(){ mx=-9999; my=-9999; });
  window.addEventListener('touchmove',function(e){ if(e.touches[0]){ mx=e.touches[0].clientX; my=e.touches[0].clientY; } },{passive:true});
  var rt; window.addEventListener('resize',function(){ clearTimeout(rt); rt=setTimeout(size,180); });
  size(); requestAnimationFrame(frame);
})();
</script>
</body>
